<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Content Security Policy: allows EduLedger styles, scripts, Google Fonts, Firebase, and local/data/blob images -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' blob: https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; object-src 'none'; base-uri 'self';"
    />

    <title>EduLedger — School Management &amp; Accounts Finance PWA</title>
    <meta
      name="description"
      content="Offline-first Progressive Web App for comprehensive school management, student/staff attendance, fee collection, expense tracking, and financial analytics."
    />
    <meta property="og:title" content="EduLedger — School Management &amp; Accounts Finance PWA" />
    <meta
      property="og:description"
      content="Offline-first Progressive Web App for comprehensive school management, student/staff attendance, fee collection, expense tracking, and financial analytics."
    />
    <meta property="og:type" content="website" />

    <!-- PWA & Mobile App Icons / Manifest -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="application-name" content="EduLedger" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduLedger" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#1E1B4B" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Inter, JetBrains Mono & Certificate Typography (English + Urdu RTL) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Great+Vibes&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Early PWA install-prompt capture & dark-mode boot (wrapped safely so it can never block render) -->
    <script>
      (function () {
        try {
          window.__pwaInstallPrompt = null;
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__pwaInstallPrompt = e;
            window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
          });
          window.addEventListener('appinstalled', function () {
            window.__pwaInstallPrompt = null;
            window.dispatchEvent(new CustomEvent('pwa-app-installed'));
          });
        } catch (err) {
          console.warn('[EduLedger] Install prompt listener warning:', err);
        }

        try {
          var savedTheme = localStorage.getItem('eduledger_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (err) {
          // Safe fallback to default light theme if storage is restricted
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-[Inter,sans-serif] selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
